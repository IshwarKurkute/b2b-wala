<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Driver</title>

<style>

body{

font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.container{

width:400px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);

}

h2{

text-align:center;
margin-bottom:20px;

}

input,select{

width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;

}

button{

width:100%;
padding:12px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2>Add Driver</h2>

<form id="driverForm">

<input
type="text"
id="name"
placeholder="Driver Name"
required
>

<input
type="text"
id="mobile"
placeholder="Mobile Number"
required
>

<input
type="text"
id="vehicleNumber"
placeholder="Vehicle Number"
required
>

<select id="vehicleType">

<option>Bike</option>
<option>Auto</option>
<option>Mini Truck</option>
<option>Pickup</option>

</select>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">

Save Driver

</button>

</form>

</div>

<script src="add-driver.js"></script>

</body>

</html>
