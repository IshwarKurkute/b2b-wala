<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Register</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>B2B Wala</h1>

    <h2>Retailer Registration</h2>

    <form id="registerForm">

        <input
            type="text"
            id="shopName"
            placeholder="Enter Shop Name"
            required
        >

        <input
            type="text"
            id="ownerName"
            placeholder="Enter Owner Name"
            required
        >

        <input
            type="text"
            id="mobile"
            placeholder="Enter Mobile Number"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Create Password"
            required
        >

        <input
            type="text"
            id="address"
            placeholder="Enter Address"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p style="margin-top:15px;">
        Already have an account?
        <a href="retailer-login.html">Login</a>
    </p>

</div>

<script src="retailer-register.js"></script>

</body>
</html>
