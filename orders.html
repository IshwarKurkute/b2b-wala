<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders</title>

    <style>

        body{
            margin:0;
            padding:30px;
            background:#f5f5f5;
            font-family:Arial;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        table{

            width:100%;
            border-collapse:collapse;
            background:white;

        }

        th{

            background:#007bff;
            color:white;
            padding:15px;

        }

        td{

            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;

        }

        tr:hover{

            background:#f2f2f2;

        }

        .pending{

            color:orange;
            font-weight:bold;

        }

    </style>

</head>

<body>

<h1>Orders</h1>

<table>

<thead>

<tr>

<th>Retailer</th>
<th>Product</th>
<th>Quantity</th>
<th>Price</th>
<th>Total</th>
<th>Status</th>

</tr>

</thead>

<tbody id="orderTable">

</tbody>

</table>

<script src="orders.js"></script>

</body>

</html>
